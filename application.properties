# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=bookstore-backend
server.port=8080

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/bookstore
# For MongoDB Atlas (cloud):
# spring.data.mongodb.uri=mongodb+srv://username:password@cluster.mongodb.net/bookstore?retryWrites=true&w=majority

# MongoDB connection settings
spring.data.mongodb.auto-index-creation=true

# ===============================
# JWT CONFIGURATION
# ===============================
# Change this to a strong secret key in production
jwt.secret=MySecretKeyForJWTTokenGenerationBookstore2024VeryLongAndSecure
jwt.access-token-expiration=3600000
# 1 hour = 3600000 ms
jwt.refresh-token-expiration=604800000
# 7 days = 604800000 ms

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Password encoding strength
security.password.strength=12

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
file.upload.dir=./uploads
file.upload.images.dir=./uploads/images

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
# Sign up at https://cloudinary.com/
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ===============================
# EMAIL CONFIGURATION (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email templates
email.from=noreply@bookstore.com
email.support=support@bookstore.com

# ===============================
# PAYMENT GATEWAY CONFIGURATION
# ===============================
# VNPay
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:3000/payment/callback
vnpay.tmn-code=your_vnpay_tmn_code
vnpay.hash-secret=your_vnpay_hash_secret

# MoMo
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.partner-code=your_momo_partner_code
momo.access-key=your_momo_access_key
momo.secret-key=your_momo_secret_key
momo.return-url=http://localhost:3000/payment/momo/callback
momo.notify-url=http://localhost:8080/api/payment/momo/notify

# ===============================
# FRONTEND URL
# ===============================
frontend.url=http://localhost:3000
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# ===============================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Log file configuration
logging.file.name=logs/bookstore.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.type=simple

# ===============================
# ACTUATOR (Health Check & Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===============================
# BUSINESS CONFIGURATION
# ===============================
# Shipping
shipping.free-threshold=500000
# Free ship cho đơn >= 500k
shipping.default-fee=30000
# Phí ship mặc định 30k

# Order
order.auto-cancel-days=7
# Tự động hủy đơn sau 7 ngày nếu không xác nhận
order.completion-days=3
# Tự động hoàn thành sau 3 ngày kể từ khi giao hàng

# Stock alert
inventory.low-stock-threshold=10
# Cảnh báo khi tồn kho < 10

# Review
review.require-purchase=true
# Yêu cầu mua hàng mới được review
review.auto-approve=false
# Tự động duyệt review

# ===============================
# TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
