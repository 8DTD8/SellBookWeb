# POST Render deploy hooks after push to Test_cloud (does not touch main).
# In Render: each service → Settings → Deploy Hook → copy URL into GitHub repo secrets:
#   RENDER_DEPLOY_HOOK_API, RENDER_DEPLOY_HOOK_WEB
# If secrets are unset, steps are skipped.

name: Render deploy hooks (Test_cloud)

on:
  push:
    branches:
      - Test_cloud

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API service deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger static site deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_WEB != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
