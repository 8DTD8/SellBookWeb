# Render Blueprint — SellBookWeb (API Docker + Static SPA)
# New → Blueprint → chọn repo; điền các biến sync: false khi được hỏi.
# Đặt tên service cố định để biết URL .onrender.com trước khi cấu hình CORS / PUBLIC_API_URL.

# dockerfilePath / dockerContext / staticPublishPath: relative to REPO ROOT (Render Blueprint spec).
# Tránh rootDir + "Dockerfile" — dễ resolve sai thành ./Dockerfile ở gốc repo → build fail.

services:
  - type: web
    name: sellbook-api
    runtime: docker
    plan: free
    region: oregon
    branch: Test_cloud
    dockerfilePath: ./SellBookWeb-backend/Dockerfile
    dockerContext: ./SellBookWeb-backend
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - SellBookWeb-backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # Static sites: không dùng region (CDN toàn cầu) — xem Render Blueprint spec
  - type: web
    name: sellbook-web
    runtime: static
    branch: Test_cloud
    buildCommand: cd SellBookWeb-frontend && sh render-build.sh
    staticPublishPath: ./SellBookWeb-frontend
    buildFilter:
      paths:
        - SellBookWeb-frontend/**
    envVars:
      - key: PUBLIC_API_URL
        sync: false
