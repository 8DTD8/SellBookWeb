spring.application.name=bookstore-backend
server.port=8080

# MongoDB for Testing - Using embedded MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/bookstore-test
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationBookstore2024VeryLongAndSecure
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Security Configuration
security.password.strength=12

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload.dir=./uploads
file.upload.images.dir=./uploads/images
