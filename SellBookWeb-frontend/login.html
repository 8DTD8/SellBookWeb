<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng bán sách - Đăng nhập</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            background-color: white;
            cursor: pointer;
        }

        .toggle-form {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 4px;
            display: flex;
            gap: 0;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
            border-bottom: 3px solid transparent;
        }

        .toggle-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .error {
            background-color: #fed7d7;
            color: #c53030;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error.show {
            display: block;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h1>📚 Cửa Hàng Sách</h1>
                <p>Quản lý cửa hàng bán sách trực tuyến</p>
            </div>

            <div class="error" id="errorMessage"></div>

            <div class="toggle-form">
                <button class="toggle-btn active" onclick="toggleForm('login')">Đăng nhập</button>
                <button class="toggle-btn" onclick="toggleForm('register')">Đăng ký</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="form-container active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <div class="form-group">
                    <label>Vai trò:</label>
                    <select id="loginRole" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option value="CUSTOMER">Khách hàng</option>
                        <option value="ADMIN">Quản trị viên</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">Đăng nhập</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="form-container" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Tên:</label>
                    <input type="text" id="registerName" required>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="registerPassword" required>
                </div>

                <div class="form-group">
                    <label>Xác nhận mật khẩu:</label>
                    <input type="password" id="registerPasswordConfirm" required>
                </div>

                <div class="form-group">
                    <label>Điện thoại:</label>
                    <input type="tel" id="registerPhone">
                </div>

                <button type="submit" class="submit-btn" id="registerBtn">Đăng ký</button>
            </form>

            <div class="links">
                <p>Demo: Email: admin@test.com | Mật khẩu: 123456 | Role: ADMIN</p>
                <p>Demo Customer: Email: customer@test.com | Mật khẩu: 123456 | Role: CUSTOMER</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
