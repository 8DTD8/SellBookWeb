services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Không publish 27017 ra host — chỉ backend trong mạng Docker truy cập
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./SellBookWeb-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongo:27017/bookstore}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-SellBookWeb-JWT-Secret-Key-MinimumLength-32-Characters-Security-2026-Production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:
