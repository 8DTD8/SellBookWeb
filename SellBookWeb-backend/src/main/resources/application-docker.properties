# MongoDB: ưu tiên SPRING_DATA_MONGODB_URI (Atlas / Render). Mặc định: service mongo trong docker-compose.
# Trên Render: dán URI đầy đủ, không có khoảng trắng đầu/cuối, không bọc dấu ngoặc kép trong giá trị.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/bookstore}

# Upload & log trong container
file.upload.dir=/app/uploads
file.upload.images.dir=/app/uploads/images
logging.file.name=/app/logs/bookstore.log

# Mặc định local; trên VPS đặt biến môi trường CORS_ALLOWED_ORIGINS (ưu tiên cao hơn file này)
cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:8080

# Override bằng FRONTEND_URL khi deploy
frontend.url=http://localhost

# Production-style logging trong container
logging.level.com.bookstore=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
