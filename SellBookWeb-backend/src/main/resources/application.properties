# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=bookstore-backend
server.port=8080

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/bookstore
# For MongoDB Atlas (cloud):
# spring.data.mongodb.uri=mongodb+srv://username:password@cluster.mongodb.net/bookstore?retryWrites=true&w=majority

# MongoDB connection settings
spring.data.mongodb.auto-index-creation=true

# ===============================
# JWT CONFIGURATION
# ===============================
# JWT — development default; production: set JWT_SECRET (Docker / env)
jwt.secret=${JWT_SECRET:SellBookWeb-JWT-Secret-Key-MinimumLength-32-Characters-Security-2026-Production}
jwt.access-token-expiration=3600000
# 1 hour = 3600000 ms
jwt.refresh-token-expiration=604800000
# 7 days = 604800000 ms

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Password encoding strength
security.password.strength=12

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
file.upload.dir=./uploads
file.upload.images.dir=./uploads/images

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
# Sign up at https://cloudinary.com/
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ===============================
# STATIC RESOURCES & SPA CONFIGURATION
# ===============================
# Enable default servlet to serve static resources
spring.mvc.static-path-pattern=/static/**
spring.resources.static-locations=classpath:/static/

# Disable caching for development (set to true for production)
spring.resources.cache.period=0

# ===============================
# EMAIL CONFIGURATION (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email templates
email.from=noreply@bookstore.com
email.support=support@bookstore.com

# ===============================
# FRONTEND URL
# ===============================
# Override với biến môi trường FRONTEND_URL trên server / Docker
frontend.url=http://localhost:3000
cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:8080

# ===============================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Log file configuration
logging.file.name=logs/bookstore.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.type=simple

# ===============================
# ACTUATOR (Health Check & Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===============================
# BUSINESS CONFIGURATION
# ===============================
# Shipping
shipping.free-threshold=500000
# Free ship cho đơn >= 500k
shipping.default-fee=30000
# Phí ship mặc định 30k

# Order
order.auto-cancel-days=7
# Tự động hủy đơn sau 7 ngày nếu không xác nhận
order.completion-days=3
# Tự động hoàn thành sau 3 ngày kể từ khi giao hàng

# Stock alert
inventory.low-stock-threshold=10
# Cảnh báo khi tồn kho < 10

# Review
review.require-purchase=true
# Yêu cầu mua hàng mới được review
review.auto-approve=false
# Tự động duyệt review

# ===============================
# TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
